name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Quality & Mathematical Verification Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Algorithm Sandboxes
        run: node tools/test_algo_sandboxes.js

      - name: Verify Practical Engine
        run: node tools/test_practical_engine.js

      - name: Verify Study Engine & Spaced Repetition
        run: node tools/test_study_engine.js

      - name: Validate Exam Question Bank & Integrity
        run: python -B tools/validar_banco.py
